<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0d9488" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(6, 6)" filter="url(#softShadow)">
    <rect width="58" height="58" rx="16" fill="url(#apexGrad)"/>
    <!-- Medical Cross -->
    <path d="M29 16 V42 M16 29 H42" stroke="url(#crossGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Heartbeat Pulse Accent Line -->
    <path d="M14 36 L21 36 L25 24 L29 44 L33 33 L37 36 L44 36" fill="none" stroke="#99f6e4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <!-- Small Shine Dot -->
    <circle cx="43" cy="15" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Logo Typography -->
  <g transform="translate(76, 12)">
    <!-- Primary Brand Name -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
      Apex<tspan fill="#0d9488">Health</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="42" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.8">
      CARE &bull; CLINIC &bull; OPD
    </text>
  </g>
</svg>
